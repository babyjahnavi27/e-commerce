<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Shop</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Simple Shop</h1>
        <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()" />
    </header>

    <main>
        <div id="product-list" class="products">
            <div class="product" data-name="Laptop">
                <h2>Laptop</h2>
                <img src="D:\laptop.jfif" width="150" height="200" alt="product 1"/>
                <p>$800</p>
                <button onclick="addToCart('Laptop', 800)">Add to Cart</button>
            </div>
            <div class="product" data-name="Headphones">
                <h2>Headphones</h2>
                <p>$120</p>
                <button onclick="addToCart('Headphones', 120)">Add to Cart</button>
            </div>
            <div class="product" data-name="Smartphone">
                <h2>Smartphone</h2>
                <p>$600</p>
                <button onclick="addToCart('Smartphone', 600)">Add to Cart</button>
            </div>
            <div class="product" data-name="Watch">
                <h2>Watch</h2>
                <p>$200</p>
                <button onclick="addToCart('Watch', 200)">Add to Cart</button>
            </div>
        </div>
    </main>

    <footer>
        <h3>Cart Summary</h3>
        <p id="cart-items">No items in cart.</p>
        <p id="cart-total"></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
